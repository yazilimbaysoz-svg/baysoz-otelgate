name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest ruff

      - name: Pytest
        run: uv run pytest -q

      - name: Ruff
        run: uv run ruff check --select E,F,W,S,B .

      - name: Semgrep
        run: uvx semgrep --config p/default --error .

      - name: CLI smoke
        run: |
          uv run otelgate --version
          uv run otelgate rules
          uv run otelgate scan tests/fixtures/valid_collector.yaml
